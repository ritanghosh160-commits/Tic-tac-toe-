<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PEPE Tic Tac Toe</title>

<style>
:root{
  --bg1:#1b1464;
  --bg2:#000000;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --neon:#4cc9f0;
  --neon2:#7b2cff;
  --danger:#ff4d6d;
  --success:#00f5d4;
  --text:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  font-family:Inter,Segoe UI,system-ui,sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,var(--bg1),var(--bg2));
  color:var(--text);
  display:flex;
  flex-direction:column;
}

.glass{
  background:var(--glass);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:22px;
}

.topbar{
  margin:16px;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.profile{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:500;
  letter-spacing:.5px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--neon),var(--neon2));
}

.balance{
  padding:8px 16px;
  border-radius:50px;
  background:rgba(0,0,0,0.4);
  border:1px solid var(--border);
  font-weight:600;
  font-size:.9rem;
}

.main{
  flex:1;
  padding:0 20px 20px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.section{
  width:100%;
  max-width:420px;
  animation:fadeIn .4s ease;
}

.hidden{display:none;}

.board{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.cell{
  aspect-ratio:1;
  border-radius:18px;
  background:rgba(0,0,0,0.35);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:2.6rem;
  cursor:pointer;
  transition:.2s ease;
  border:1px solid var(--border);
}

.cell:hover{
  transform:scale(1.04);
  box-shadow:0 0 20px rgba(76,201,240,.25);
}

.cell.O{color:var(--neon);}
.cell.X{color:var(--danger);}

.status{
  margin-top:20px;
  text-align:center;
  font-weight:500;
  letter-spacing:.5px;
  min-height:24px;
}

.rewardBox{
  margin-top:18px;
  display:flex;
  justify-content:center;
}

.btn{
  padding:14px 22px;
  border-radius:16px;
  border:1px solid var(--border);
  background:linear-gradient(135deg,var(--neon2),var(--neon));
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:.3s ease;
}

.btn.secondary{
  background:rgba(255,255,255,0.08);
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.card{
  padding:22px;
}

.card h2{
  margin-bottom:14px;
  font-size:1.2rem;
}

.taskItem{
  padding:12px;
  margin-top:10px;
  border-radius:14px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  font-size:.9rem;
}

.bottomMenu{
  margin:0 16px 16px;
  padding:12px;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.menuBtn{
  flex:1;
  background:none;
  border:none;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:.75rem;
  cursor:pointer;
  opacity:.7;
  transition:.3s;
}

.menuBtn.active{
  opacity:1;
  color:var(--neon);
}

.menuBtn svg{
  width:20px;
  height:20px;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
</style>

<!-- FIREBASE (UNTOUCHED) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGLk-WfinYzZuaC0qu-dzpY_mL6KuYWbc",
  authDomain: "r-vox-pepexo.firebaseapp.com",
  projectId: "r-vox-pepexo",
  storageBucket: "r-vox-pepexo.firebasestorage.app",
  messagingSenderId: "991544250422",
  appId: "1:991544250422:web:4f728ad459f09196f9c897"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.firebaseDB = db;
window.firebaseDoc = doc;
window.firebaseGetDoc = getDoc;
window.firebaseSetDoc = setDoc;
window.firebaseUpdateDoc = updateDoc;
</script>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar glass">
  <div class="profile">
    <div class="avatar">
      <!-- user icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M20 21a8 8 0 0 0-16 0"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    Player
  </div>
  <div class="balance" id="balance">0 PEPE</div>
</div>

<div class="main">
  <!-- PLAY -->
  <div class="section" id="playSection">
    <div class="board" id="board"></div>
    <div class="status" id="status"></div>
    <div class="rewardBox" id="rewardBox"></div>
  </div>

  <!-- TASK -->
  <div class="section hidden" id="taskSection">
    <div class="card glass">
      <h2>Tasks</h2>
      <div class="taskItem">Join Channel = 25 PEPE</div>
      <div class="taskItem">Watch 500 Ads = 1000 PEPE</div>
      <div class="taskItem">Win 100 Games = 175 PEPE</div>
    </div>
  </div>

  <!-- WALLET -->
  <div class="section hidden" id="walletSection">
    <div class="card glass">
      <h2>Wallet</h2>
      <div class="taskItem">FaucetPay Min Withdraw = 100 PEPE</div>
      <div class="taskItem">CWallet Min Withdraw = 500 PEPE</div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottomMenu glass">
  <button class="menuBtn active" id="playBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>
    Play
  </button>
  <button class="menuBtn" id="taskBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
    </svg>
    Tasks
  </button>
  <button class="menuBtn" id="walletBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="7" width="20" height="14" rx="2"/>
      <circle cx="16" cy="14" r="2"/>
    </svg>
    Wallet
  </button>
</div>

<script>
const boardEl=document.getElementById("board")
const statusEl=document.getElementById("status")
const rewardBox=document.getElementById("rewardBox")
const balanceEl=document.getElementById("balance")

const playSection=document.getElementById("playSection")
const taskSection=document.getElementById("taskSection")
const walletSection=document.getElementById("walletSection")

let board=Array(9).fill("")
let gameOver=false
let pepeBalance=0
const userId="demo_user"

loadBalance()
createBoard()

function switchTab(tab){
playSection.classList.add("hidden")
taskSection.classList.add("hidden")
walletSection.classList.add("hidden")
document.querySelectorAll(".menuBtn").forEach(b=>b.classList.remove("active"))
if(tab==="play"){playSection.classList.remove("hidden");playBtn.classList.add("active")}
if(tab==="task"){taskSection.classList.remove("hidden");taskBtn.classList.add("active")}
if(tab==="wallet"){walletSection.classList.remove("hidden");walletBtn.classList.add("active")}
}

playBtn.onclick=()=>switchTab("play")
taskBtn.onclick=()=>switchTab("task")
walletBtn.onclick=()=>switchTab("wallet")

function updateBalance(){
balanceEl.innerText=`${pepeBalance} PEPE`
}

async function loadBalance(){
const userRef=firebaseDoc(window.firebaseDB,"users",userId)
const userSnap=await firebaseGetDoc(userRef)
if(userSnap.exists()){
pepeBalance=userSnap.data().balance||0
}else{
await firebaseSetDoc(userRef,{balance:0})
pepeBalance=0
}
updateBalance()
}

async function saveBalance(){
const userRef=firebaseDoc(window.firebaseDB,"users",userId)
await firebaseUpdateDoc(userRef,{balance:pepeBalance})
}

function createBoard(){
boardEl.innerHTML=""
board.forEach((val,i)=>{
const cell=document.createElement("div")
cell.classList.add("cell")
if(val){cell.innerText=val;cell.classList.add(val)}
cell.onclick=()=>playerMove(i)
boardEl.appendChild(cell)
})
}

function playerMove(i){
if(board[i]||gameOver)return
board[i]="O"
createBoard()
if(checkWin("O"))return
setTimeout(computerMove,250)
}

function computerMove(){
let move=getBestMove()
board[move]="X"
createBoard()
checkWin("X")
}

function getBestMove(){
let empty=board.map((v,i)=>v===""?i:null).filter(v=>v!==null)
for(let i of empty){board[i]="X";if(isWinner("X")){board[i]="";return i}board[i]=""}
for(let i of empty){board[i]="O";if(isWinner("O")){board[i]="";return i}board[i]=""}
if(board[4]==="")return 4
const corners=[0,2,6,8].filter(i=>board[i]==="")
if(corners.length)return corners[Math.floor(Math.random()*corners.length)]
return empty[Math.floor(Math.random()*empty.length)]
}

function isWinner(p){
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]
return wins.some(w=>w.every(i=>board[i]===p))
}

function resetGame(){
board=Array(9).fill("")
gameOver=false
statusEl.innerText=""
rewardBox.innerHTML=""
createBoard()
}

function checkWin(player){
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]
for(let w of wins){
if(w.every(i=>board[i]===player)){
gameOver=true
if(player==="O"){
statusEl.innerText="You Won"
rewardBox.innerHTML=`<button class="btn" onclick="collectReward(10)">Collect 10 PEPE</button>`
}else{
statusEl.innerText="You Lost"
rewardBox.innerHTML=`<button class="btn secondary" onclick="resetGame()">Restart</button>`
}
return true
}}
if(!board.includes("")){
gameOver=true
statusEl.innerText="Match Draw"
rewardBox.innerHTML=`<button class="btn" onclick="collectReward(5)">Collect 5 PEPE</button>`
}
return false
}

function collectReward(amount){
pepeBalance=Number(pepeBalance)+amount
updateBalance()
saveBalance()
resetGame()
}
</script>
</body>
</html>
