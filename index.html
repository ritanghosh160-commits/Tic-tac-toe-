<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Balance Test</title>

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Segoe UI,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:#1b1b1b;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:90%;
    max-width:350px;
}

.balance{
    font-size:2rem;
    margin:20px 0;
}

button{
    border:none;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
    font-size:1rem;
    margin-top:10px;
    width:100%;
}

.addBtn{
    background:#00b894;
    color:white;
}

.resetBtn{
    background:#7d2ae8;
    color:white;
}

</style>
</head>

<body>

<div class="box">

<h1>🐸 PEPE Balance</h1>

<div class="balance" id="balance">
0 PEPE
</div>

<button class="addBtn" id="addBtn">
+ Add 10 PEPE
</button>

<button class="resetBtn" id="resetBtn">
Reset Balance
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "YOUR_AUTH_DOMAIN",

projectId: "YOUR_PROJECT_ID",

storageBucket: "YOUR_STORAGE_BUCKET",

messagingSenderId: "YOUR_MESSAGING_ID",

appId: "YOUR_APP_ID"

};

/* INIT */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* ELEMENTS */

const balanceEl =
document.getElementById("balance");

const addBtn =
document.getElementById("addBtn");

const resetBtn =
document.getElementById("resetBtn");

/* USER */

const userId = "demo-user";

let pepeBalance = 0;

/* LOAD USER */

async function loadBalance(){

const userRef =
doc(db,"users",userId);

const userSnap =
await getDoc(userRef);

if(userSnap.exists()){

pepeBalance =
userSnap.data().balance || 0;

}else{

await setDoc(userRef,{
balance:0
});

pepeBalance = 0;

}

updateUI();

}

/* UPDATE UI */

function updateUI(){

balanceEl.innerText =
`${pepeBalance} PEPE`;

}

/* ADD BALANCE */

async function addBalance(){

pepeBalance += 10;

updateUI();

const userRef =
doc(db,"users",userId);

await updateDoc(userRef,{
balance:pepeBalance
});

}

/* RESET BALANCE */

async function resetBalance(){

pepeBalance = 0;

updateUI();

const userRef =
doc(db,"users",userId);

await updateDoc(userRef,{
balance:0
});

}

/* BUTTONS */

addBtn.onclick = addBalance;

resetBtn.onclick = resetBalance;

/* START */

loadBalance();

</script>

</body>
</html>
