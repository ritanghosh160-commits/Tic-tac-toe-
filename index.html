<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stable Tic Tac Toe</title>

<style>

*{
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    margin:0;
    background:radial-gradient(circle at top,#1b1464,#000);
    color:white;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    margin-bottom:20px;
}

.board{
    width:90vw;
    max-width:340px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.cell{
    aspect-ratio:1;
    background:#111;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2.5rem;
    cursor:pointer;
    transition:0.2s;
}

.cell:active{
    transform:scale(0.95);
}

.O{
    color:#00eaff;
}

.X{
    color:#ff7b7b;
}

#status{
    margin-top:20px;
    font-size:1.1rem;
    text-align:center;
}

button{
    margin-top:20px;
    border:none;
    padding:12px 24px;
    border-radius:12px;
    background:#7d2ae8;
    color:white;
    cursor:pointer;
    font-size:1rem;
}

</style>
</head>

<body>

<h1>🎮 Tic Tac Toe</h1>

<div class="board" id="board"></div>

<div id="status"></div>

<button id="restartBtn">
🔄 Restart Game
</button>

<script>

const boardEl = document.getElementById("board")
const statusEl = document.getElementById("status")
const restartBtn = document.getElementById("restartBtn")

let board = ["","","","","","","","",""]
let gameOver = false

createBoard()

restartBtn.onclick = resetGame

function createBoard(){

boardEl.innerHTML = ""

board.forEach((val,i)=>{

const cell = document.createElement("div")

cell.classList.add("cell")

if(val){

cell.innerText = val
cell.classList.add(val)

}

cell.onclick = ()=>playerMove(i)

boardEl.appendChild(cell)

})

}

function playerMove(i){

if(board[i] || gameOver) return

board[i] = "O"

createBoard()

if(checkResult("O")) return

setTimeout(computerMove,300)

}

function computerMove(){

let move = getBestMove()

board[move] = "X"

createBoard()

checkResult("X")

}

function getBestMove(){

let empty = board
.map((v,i)=>v===""?i:null)
.filter(v=>v!==null)

/* WIN */

for(let i of empty){

board[i] = "X"

if(isWinner("X")){

board[i] = ""

return i

}

board[i] = ""

}

/* BLOCK */

for(let i of empty){

board[i] = "O"

if(isWinner("O")){

board[i] = ""

return i

}

board[i] = ""

}

/* CENTER */

if(board[4] === "") return 4

/* CORNERS */

const corners =
[0,2,6,8].filter(i=>board[i]==="")

if(corners.length > 0){

return corners[
Math.floor(Math.random()*corners.length)
]

}

/* RANDOM */

return empty[
Math.floor(Math.random()*empty.length)
]

}

function isWinner(player){

const wins = [
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
]

return wins.some(w =>
w.every(i=>board[i]===player)
)

}

function checkResult(player){

if(isWinner(player)){

gameOver = true

statusEl.innerText =
player==="O"
? "🎉 You Win!"
: "🤖 Computer Wins!"

return true

}

if(!board.includes("")){

gameOver = true

statusEl.innerText =
"😐 Match Draw"

return true

}

return false

}

function resetGame(){

board = ["","","","","","","","",""]

gameOver = false

statusEl.innerText = ""

createBoard()

}

</script>

</body>
</html>
