<!DOCTYPE html>
<html lang="en">
<head>

<!-- ✅ Monetag Ad Script -->
<script src='//libtl.com/sdk.js'
data-zone='10442791'
data-sdk='show_10442791'></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe Earn</title>

<style>
*{
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}
body{
    margin:0;
    height:100vh;
    background: radial-gradient(circle at top, #1b1464, #000);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* HOME */
#home{text-align:center;}
#startBtn{
    padding:15px 40px;
    font-size:1.2rem;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#00f2ff,#7d2ae8);
    color:white;
    cursor:pointer;
}

/* GAME */
#game{
    display:none;
    flex-direction:column;
    align-items:center;
}

.board{
    width:90vw;
    max-width:320px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.cell{
    aspect-ratio:1;
    background:#111;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2.5rem;
    cursor:pointer;
}

.O{color:#00eaff;}
.X{color:#ff8a8a;}

#status{margin-top:15px;}
#restart{
    margin-top:10px;
    padding:8px 20px;
    border:none;
    background:#7d2ae8;
    color:white;
}
</style>
</head>

<body>

<div id="home">
    <h1>🎮 Play & Earn</h1>
    <button id="startBtn">Start Game</button>
</div>

<div id="game">
    <div class="board" id="board"></div>
    <div id="status"></div>
    <button id="restart">Restart</button>
</div>

<script>

/* 🔥 AUTO AD ON LOAD */
window.onload = () => {
    setTimeout(() => {
        if (typeof show_10442791 === "function") {
            show_10442791().catch(()=>{});
        }
    }, 500);
};

const home = document.getElementById("home");
const game = document.getElementById("game");
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

let board = Array(9).fill("");
let gameOver = false;

document.getElementById("startBtn").onclick = () => {
    home.style.display="none";
    game.style.display="flex";
    createBoard();
};

document.getElementById("restart").onclick = resetGame;

function createBoard(){
    boardEl.innerHTML="";
    board.forEach((val,i)=>{
        const cell=document.createElement("div");
        cell.classList.add("cell");
        if(val){
            cell.innerText=val;
            cell.classList.add(val);
        }
        cell.onclick=()=>playerMove(i);
        boardEl.appendChild(cell);
    });
}

function playerMove(i){
    if(board[i] || gameOver) return;
    board[i]="O";
    createBoard();
    if(checkWin("O")) return;
    setTimeout(computerMove,300);
}

function computerMove(){
    let empty = board.map((v,i)=>v==""?i:null).filter(v=>v!==null);
    if(empty.length===0) return;
    let move = empty[Math.floor(Math.random()*empty.length)];
    board[move]="X";
    createBoard();
    checkWin("X");
}

function resetGame(){
    board = Array(9).fill("");
    gameOver=false;
    statusEl.innerText="";
    createBoard();
}

/* 🔥 GAME RESULT + REWARDED AD */
function checkWin(player){
    const wins=[
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    for(let w of wins){
        if(w.every(i=>board[i]===player)){
            gameOver=true;

            statusEl.innerText =
                (player==="O") ?
                "🎉 You Win! Reward Unlocking..." :
                "🤖 Computer Wins! Try Again";

            setTimeout(showRewardAd,800);
            return true;
        }
    }

    if(!board.includes("")){
        gameOver=true;
        statusEl.innerText="😐 Draw! Watch Ad";

        setTimeout(showRewardAd,800);
    }
    return false;
}

/* 🔥 REWARDED AD FUNCTION */
function showRewardAd(){
    if (typeof show_10442791 === "function") {
        show_10442791().then(() => {
            alert("✅ Reward unlocked!");
            resetGame();
        }).catch(() => {
            resetGame();
        });
    } else {
        resetGame();
    }
}

</script>

</body>
</html>
